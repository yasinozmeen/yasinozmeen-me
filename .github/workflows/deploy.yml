name: Deploy to Pi

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, pi, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          sudo docker build -t yasinozmeen-me:latest .

      - name: Deploy container
        run: |
          sudo docker rm -f yasinozmeen-me || true
          sudo docker run -d \
            --name yasinozmeen-me \
            --restart always \
            -p 127.0.0.1:3001:80 \
            yasinozmeen-me:latest
          echo "Deploy OK — $(date)"
